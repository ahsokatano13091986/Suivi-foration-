<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12365b"><link rel="manifest" href="manifest.webmanifest"><title>Foration V2</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#172b40;font:16px system-ui}header,main,nav{max-width:850px;margin:auto}header{text-align:center;background:white;padding:15px}header img{width:180px}h1{margin:0;font-size:24px}nav{display:flex;position:sticky;top:0;background:#12365b;padding:8px;gap:6px;z-index:2}button{background:#12365b;color:white;border:0;border-radius:8px;padding:13px;font:inherit;cursor:pointer}nav button{flex:1;padding:10px 3px}nav button.active{background:#fff;color:#12365b}main{padding:12px}section,.panel{background:white;border-radius:12px;padding:16px;margin-bottom:12px}label{display:block;font-weight:600;margin:12px 0}input,select,textarea{display:block;width:100%;font:inherit;padding:12px;border:1px solid #aab7c4;border-radius:7px;margin-top:5px;background:white;color:#172b40} .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;flex-wrap:wrap;gap:8px}.metric{background:#e6eef5;padding:12px;border-radius:8px;margin:12px 0}.muted{color:#526779;font-size:14px}article{border-top:1px solid #ddd;padding:12px 0;overflow-wrap:anywhere}button.danger{background:#a32c32} [hidden]{display:none!important}@media print{nav,button,#entry,#archives,#tools,#pick{display:none!important}body{background:white}#current{display:block!important}article{break-inside:avoid}header img{width:130px}}</style><header><img src="icon-192.png" alt="Razel-Bec Foration"><p>Ligne 15 – Chantier 2302 · V2</p></header><nav><button data-tab="entry">Saisie</button><button data-tab="current">Tir en cours</button><button data-tab="archives">Archives</button></nav><main><section id="entry"><h2>Nouvelle foration</h2><form id="form"><label>Date de début<input required type="date" id="date"></label><label>Numéro de tir<input required id="tir"></label><label>Numéro de foration<input required id="hole"></label><label>Longueur réelle (m)<input required id="length" inputmode="decimal" placeholder="12,50"></label><div class="pair"><label>Heure de début<input required type="time" id="start"></label><label>Heure de fin<input required type="time" id="end"></label></div><div id="preview" class="metric">Durée : —</div><label>Arrivées d’eau<select id="water"><option>Non</option><option>Oui</option></select></label><label>Nature du terrain<input required id="ground" value="Craie blanche"></label><label>Observations<textarea id="notes" rows="3"></textarea></label><div class="actions"><button type="submit" id="save">Enregistrer</button><button type="button" id="cancel" hidden>Annuler</button></div></form><p id="status" role="status"></p></section><section id="current" hidden><h2 id="heading">Tir en cours</h2><div id="pick"><label>Choisir un tir<select id="chosen"></select></label></div><div id="summary" class="metric"></div><div class="actions"><button id="close">Clôturer le tir</button><button id="csv">Excel / CSV</button><button id="pdf">Imprimer / PDF</button></div><div id="records"></div></section><section id="archives" hidden><h2>Archives des tirs</h2><div id="archlist"></div><div id="tools"><h3>Sauvegarde locale</h3><button id="backup">Exporter sauvegarde JSON</button><label>Restaurer une sauvegarde V2<input type="file" accept=".json" id="restore"></label><p class="muted">Les données restent dans ce navigateur. Sauvegarder régulièrement.</p></div></section></main><script src="app.js"></script></html>
